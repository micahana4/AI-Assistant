{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="theme-color" content="#111827">
    <link rel="manifest" href="{% static 'manifest.json' %}">

    <title>AI Assistant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f3f4f6;
            font-family: Arial, sans-serif;
        }

        .chat-container {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 18px #00000012;
        }

        #chat-box {
            min-height: 350px;
            max-height: 450px;
            overflow-y: auto;
            padding: 12px;
            background: #f9fafb;
            border-radius: 10px;
        }

        .message {
            padding: 12px 15px;
            margin-bottom: 12px;
            border-radius: 12px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .user {
            background: #111827;
            color: white;
            margin-left: 15%;
        }

        .assistant {
            background: #e5e7eb;
            color: #111827;
            margin-right: 15%;
        }
    </style>
</head>

<body>
<div class="container">
    <div class="chat-container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>AI Assistant</h3>
            <button id="install-button"
                    class="btn btn-outline-secondary btn-sm"
                    hidden>
                Install App
            </button>
        </div>

        <p class="text-muted">Ask a question and learn something new.</p>

        <div id="offline-message"
             class="alert alert-warning"
             hidden>
            You are offline. AI responses require an internet connection.
        </div>

        <div id="chat-box" aria-live="polite">
            <div class="message assistant">
                Hi! I'm your AI assistant. What would you like to know?
            </div>
        </div>

        <form id="chat-form" class="mt-3">
            {% csrf_token %}

            <label for="prompt" class="form-label">
                Your question
            </label>

            <textarea id="prompt"
                      name="prompt"
                      class="form-control"
                      rows="3"
                      placeholder="Ask a question..."
                      required></textarea>

            <div class="d-flex justify-content-between mt-3">
                <button type="button"
                        id="clear-button"
                        class="btn btn-outline-secondary">
                    Clear
                </button>

                <button type="submit"
                        id="send-button"
                        class="btn btn-dark">
                    Send
                </button>
            </div>
        </form>

        <p class="text-center text-muted small mt-3 mb-0">
            AI Assistant · Powered by Gemini · PWA Enabled
        </p>
    </div>
</div>

<script>
    const form = document.getElementById("chat-form");
    const promptInput = document.getElementById("prompt");
    const chatBox = document.getElementById("chat-box");
    const sendButton = document.getElementById("send-button");
    const offlineMessage = document.getElementById("offline-message");

    function addMessage(text, sender) {
        const message = document.createElement("div");
        message.className = `message ${sender}`;
        message.textContent = text;
        chatBox.appendChild(message);
        chatBox.scrollTop = chatBox.scrollHeight;
        return message;
    }

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const prompt = promptInput.value.trim();

        if (!prompt) return;

        if (!navigator.onLine) {
            addMessage(
                "You are offline. Reconnect to ask Gemini.",
                "assistant"
            );
            return;
        }

        addMessage(prompt, "user");
        promptInput.value = "";
        sendButton.disabled = true;
        sendButton.textContent = "Thinking...";

        const loading = addMessage("Thinking...", "assistant");

        try {
            const formData = new FormData();
            formData.append("prompt", prompt);

            const response = await fetch("{% url 'ask_gemini' %}", {
                method: "POST",
                headers: {
                    "X-CSRFToken": document.querySelector(
                        "[name=csrfmiddlewaretoken]"
                    ).value
                },
                body: formData
            });

            const data = await response.json();
            loading.textContent = response.ok
                ? (data.response || "No response was generated.")
                : (data.error || "Something went wrong.");

        } catch (error) {
            loading.textContent =
                "Unable to connect to the assistant. Please try again.";
        } finally {
            sendButton.disabled = false;
            sendButton.textContent = "Send";
            promptInput.focus();
        }
    });

    document.getElementById("clear-button").addEventListener("click", () => {
        chatBox.replaceChildren();

        addMessage(
            "Chat cleared. What would you like to ask?",
            "assistant"
        );
    });

    function updateConnectionStatus() {
        offlineMessage.hidden = navigator.onLine;
    }

    window.addEventListener("online", updateConnectionStatus);
    window.addEventListener("offline", updateConnectionStatus);
    updateConnectionStatus();

    let installPrompt;

    window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        installPrompt = event;
        document.getElementById("install-button").hidden = false;
    });

    document.getElementById("install-button").addEventListener(
        "click",
        async () => {
            if (!installPrompt) return;

            installPrompt.prompt();
            await installPrompt.userChoice;

            installPrompt = null;
            document.getElementById("install-button").hidden = true;
        }
    );

    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register(
                "{% static 'service-worker.js' %}"
            ).catch((error) => {
                console.error("Service worker registration failed:", error);
            });
        });
    }
</script>
</body>
</html>
